name: Refresh Dune Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

concurrency:
  group: vvv-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch data from APIs
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          VENICE_API_KEY: ${{ secrets.VENICE_API_KEY }}
          VVV_LOCKED_ADDRESSES: ${{ secrets.VVV_LOCKED_ADDRESSES }}
          VVV_BURN_ADDRESSES: ${{ secrets.VVV_BURN_ADDRESSES }}
        run: python scripts/refresh.py
      - name: Build largest unstakers activity (7-day ranking, all available history)
        env:
          VENICE_API_KEY: ${{ secrets.VENICE_API_KEY }}
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          VVV_ACTIVITY_BUDGET_SECONDS: '900'
          VVV_ACTIVITY_HISTORY_DAYS: 'all'
        run: |
          python -u scripts/unstaker_activity.py || echo "::warning::Wallet activity indexing incomplete; retaining last verified data and checkpoint."
      - name: Build holder distribution (Venice RPC)
        env:
          VENICE_API_KEY: ${{ secrets.VENICE_API_KEY }}
          VVV_TIME_BUDGET_SECONDS: '1500'
        run: python scripts/holders.py || echo "holder backfill not complete this run"
      - name: Build unlocked-VVV sell pressure (Venice RPC)
        env:
          VENICE_API_KEY: ${{ secrets.VENICE_API_KEY }}
          VVV_TIME_BUDGET_SECONDS: '5400'
        run: python scripts/unlock_flow.py || echo "unlock backfill not complete this run"
      - name: Commit data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/*.json
          git commit -m "chore: refresh data" || echo "No changes"
          git push
